[project]
name = "ai-smm-department"
version = "0.1.0"
description = "Multi-agent AI SMM system with LangGraph, Langfuse and Threads publishing"
readme = "README.md"
authors = [
    { name = "Ruslan Babashaikhov", email = "ruslan.babashaikhov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.1",
    "apscheduler>=3.11.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langfuse>=4.17.0",
    "langgraph>=1.2.13",
    "paramiko>=5.0.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-smm = "ai_smm.cli:main"
ai-smm-worker = "ai_smm.worker:main"
ai-smm-healthcheck = "ai_smm.healthcheck:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
module-name = "ai_smm"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
markers = [
    "postgres: needs a live PostgreSQL (AI_SMM_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:ai_smm.*"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Autogenerated migrations are not hand-formatted.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "DTZ", "UP"]
ignore = [
    # The codebase consistently uses datetime.timezone.utc; rewriting every
    # call site to the UTC alias would churn working code for no gain.
    "UP017",
    # A publisher must survive an unknown failure from an external API
    # rather than crash the worker; the broad handlers are deliberate and
    # each one records the outcome.
    "BLE001",
    # (str, Enum) is kept over StrEnum: the SQLAlchemy Enum columns are
    # built from these classes and the mixin form is what was tested.
    "UP042",
    # PEP 695 type parameters would break nothing, but the one generic
    # helper reads fine as it is.
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# The existing CLI scripts call load_dotenv() before importing anything that
# reads the environment at import time. That ordering is deliberate, so the
# import-position rule does not apply to them.
"scripts/*.py" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["ai_smm"]
lines-after-imports = 2
