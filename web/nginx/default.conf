# SMM Control Center: one origin for the SPA and the API.
#
#   /api, /api/*        -> FastAPI (smm-api:8000)
#   /health, /health/*  -> FastAPI
#   /docs, /redoc, /openapi.json -> FastAPI (404 JSON unless
#                          AI_SMM_API_DOCS_ENABLED=true on the API)
#   /assets/*           -> hashed build output, 404 when missing
#   anything else       -> the file if it exists, otherwise index.html
#                          (client-side routes such as /projects/demo/content)
#
# The API prefixes never fall back to index.html: an unknown /api or
# /health path reaches FastAPI and comes back as its 404 JSON envelope.
#
# Included inside nginx's http {} block (conf.d). No secrets, no
# environment substitution: the only address here is the compose service
# name of the API.

server_tokens off;

# One id per request, shared by the nginx log and the API log. A caller's
# own X-Request-ID is passed through for the API to accept or replace.
map $http_x_request_id $smm_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format smm_web '$remote_addr [$time_iso8601] "$request" $status '
                   '$body_bytes_sent $request_time rid=$smm_request_id '
                   'upstream=$upstream_status';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log smm_web;

    root /srv/smm-web;
    index index.html;
    autoindex off;
    charset utf-8;

    # The API takes JSON bodies only; nothing here uploads files.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, consulted per request because proxy_pass
    # takes a variable. nginx therefore starts without the API being up,
    # and follows the API to its new address after a restart instead of
    # keeping the one it resolved at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $smm_api http://smm-api:8000;

    # Inherited by every location that does not set add_header itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # -- API and probes -----------------------------------------------------

    location ~ ^/(?:api|health)(?:/|$) {
        include /etc/nginx/snippets/smm-proxy.inc;
    }

    # The API decides whether these exist; with docs disabled the answer
    # is its own 404 JSON, not the SPA.
    location ~ ^/(?:docs|redoc|openapi\.json)(?:/|$) {
        include /etc/nginx/snippets/smm-proxy.inc;
    }

    # nginx's own failure to reach the API (connection refused, DNS,
    # timeout) in the API's error shape, so the client parses it as it
    # parses every other error. An error the API itself returns -- the
    # readiness 503, say -- passes through untouched.
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $smm_request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        return 502 '{"error":{"code":"DEPENDENCY_UNAVAILABLE","message":"The API is not available.","details":{"dependency":"api"},"request_id":"$smm_request_id"}}';
    }

    # -- Static files ---------------------------------------------------------

    # Content-hashed file names: cache forever, and never answer a missing
    # asset with index.html (the browser would try to run HTML as JS).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # SPA fallback. index.html is never cached, so a new build is picked
    # up on the next navigation.
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
