# AI SMM Control Center -- PRODUCTION packaging (SMM-024B.3).
#
#   operator laptop --ssh -L 8088:127.0.0.1:8088--> host loopback
#     -> 127.0.0.1:8088 (the only published port)
#     -> smm-web   nginx: React build + reverse proxy   [cc-edge, cc-internal, cc-auth]
#          ├── sign-in, sign-out, step-up -> smm-auth  [cc-auth (bind), shared (outbound)]
#          └── /api/*, /health/* -> smm-api (FastAPI)          [cc-internal, shared]
#                                     -> <postgres-container>  [shared, external]
#
# smm-auth (SMM-025D, ADR-024C-3A): the same API image, another application
# (ai_smm.api.auth_service), connected as ai_smm_auth. It verifies passwords
# and opens, closes and step-up-confirms sessions through the smm_auth
# functions; smm-api cannot (grants G2). It listens only on its fixed
# address in cc-auth, a network smm-api is not on: neither can reach the
# other, and nothing on the shared network reaches smm-auth's port.
#
# A compose project of its own, "ai-smm-control-center", next to -- never
# inside -- the worker's project "ai-smm" (compose.yaml). Nothing here
# can create, recreate, stop or remove the worker, the database or any
# other service on the host.
#
# ALWAYS run it through deploy/control-center/cc-compose.sh, never with a
# bare `docker compose`. Compose lets a .env file in the working
# directory, or COMPOSE_* variables in the shell, override this file's
# project name: run from the worker's directory, `down` here would act on
# project "ai-smm". The wrapper accepts only a fixed set of verbs and
# builds the Compose command line itself (project name, files, profiles,
# service names), pins the Docker daemon, checks the image revision
# labels, and refuses a directory that holds a .env.
#
# Deliberately absent:
#   * the worker, a scheduler, PostgreSQL -- the existing database is
#     reused; nothing here claims or publishes a publication;
#   * build: -- images are built from a reviewed commit elsewhere and
#     loaded on the host; this file can only run what is already there,
#     and pull_policy: never stops Compose from fetching a same-named
#     image from a public registry;
#   * the worker's ai-smm.env and .env -- the env files hold one database
#     URL each and nothing else: control-center.api.env for smm-api (role
#     ai_smm_cc, SMM-024C-2), control-center.env for migrate and cli (the
#     owner role, the same URL as the worker);
#   * migrations on start -- `migrate` is a one-shot operator command
#     behind its own profile, with no default command;
#   * Docker socket, volumes, public routes, and every bind mount but
#     one: smm-api reads the knowledge base READ-ONLY (SMM-034A), below.
#
# Read-only Control Center: the API refuses every business-state change
# (403 MUTATIONS_DISABLED), for every role, owner included. Changing that
# is a change to this file under review, not an environment flip.

name: ai-smm-control-center

x-logging: &logging
  driver: json-file
  options:
    # Per-service rotation: the host's daemon.json is shared with other
    # projects and is not changed for this one.
    max-size: "10m"
    max-file: "3"

# Shared by the API and the one-shot tools that run its image.
#
# Every safety-relevant value is a LITERAL. `environment:` takes
# precedence over `env_file:`, so even an env file that wrongly carried a
# Threads token or turned mutations on could not change any of these.
# Only AI_SMM_DATABASE_URL comes from the env files.
x-app-env: &app-env
  TZ: UTC
  # Business mutations off for every role. Signing in and out are
  # smm-auth's (SMM-025D); they write session and audit rows through the
  # smm_auth functions.
  AI_SMM_API_MUTATIONS_ENABLED: "false"
  # smm-api serves no login or logout of its own: nginx sends both to
  # smm-auth, and the API's roles may not create or revoke a session.
  AI_SMM_API_AUTH_ROUTES: "false"
  # No /docs, /redoc, /openapi.json.
  AI_SMM_API_DOCS_ENABLED: "false"
  # The only transport is an SSH tunnel to plain-HTTP loopback; a Secure
  # cookie would not be sent back by every browser there. The tunnel is
  # what encrypts the session on the wire.
  AI_SMM_API_COOKIE_SECURE: "false"
  # The API process's own flag (reported as api_dry_run). It is NOT the
  # worker's mode, which the API reports as "unknown".
  AI_SMM_DRY_RUN: "true"
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  # Defence in depth: no publishing or model credentials can reach this
  # process, and the Threads base URL is unroutable.
  OPENAI_API_KEY: ""
  THREADS_ACCESS_TOKEN: ""
  THREADS_API_BASE_URL: http://127.0.0.1:9
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  STORAGE_SSH_PASSWORD: ""
  STORAGE_SSH_KEY_PATH: ""

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pull_policy: never
  labels:
    # Defence in depth: Traefik already runs with exposedByDefault=false.
    traefik.enable: "false"
    ai-smm.component: control-center
  logging: *logging

services:
  smm-api:
    <<: *hardening
    image: ai-smm-api:${SMM_CC_VERSION:?set SMM_CC_VERSION to the full git commit the images were built from}
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,mode=1777
    # The API's own least-privilege role, ai_smm_cc: reads, plus advancing
    # a session's last_seen_at (grants G2, SMM-025D). PostgreSQL refuses
    # every business change, session creation and audit write from it,
    # whatever the application does (docs/least-privilege-role.md). `up`
    # and `restart` refuse unless the role checks out (cc-gate.sh,
    # ai_smm_cc.verify.sql). Never the owner URL of control-center.env.
    env_file:
      - control-center.api.env
    environment:
      <<: *app-env
      # Visible in pg_stat_activity on the shared instance.
      PGAPPNAME: ai-smm-control-center-api
      # FU-025C-2 (docs/credential-keys.md). Neither is secret; both are
      # validated by cc-compose.sh, and the allow-list must equal the
      # running worker's. The public key seals tokens an owner pastes in;
      # the private key that opens them is the worker's alone. smm-api
      # only: no other service here handles tokens.
      AI_SMM_CREDENTIALS_PUBLIC_KEY: ${SMM_CC_CREDENTIALS_PUBLIC_KEY:?set SMM_CC_CREDENTIALS_PUBLIC_KEY to the credential public key (docs/credential-keys.md)}
      AI_SMM_LEGACY_THREADS_PROJECTS: ${SMM_CC_LEGACY_THREADS_PROJECTS?set SMM_CC_LEGACY_THREADS_PROJECTS to the worker's legacy allow-list, empty for none}
      # SMM-034A: where the mount below is; the Knowledge Base page reads
      # the same files the worker's agents load.
      AI_SMM_KNOWLEDGE_ROOT: /srv/ai-smm/knowledge
    # The knowledge base, READ-ONLY, smm-api only (SMM-034A). The same host
    # directory and container path as the worker's mount (compose.yaml),
    # spelled out as literals: no variable can point it elsewhere or make
    # it writable. A missing directory fails `up` instead of being created.
    # The API serves only the top-level documents of a project the caller
    # is a member of; it never writes (there is no write route), and the
    # mount stays read-only in mutation mode too. smm-auth, smm-web,
    # migrate and cli mount nothing.
    volumes:
      - type: bind
        source: /srv/ai-smm/knowledge
        target: /srv/ai-smm/knowledge
        read_only: true
        bind:
          create_host_path: false
    # cc-internal: reached by smm-web only. shared: the one path to the
    # existing PostgreSQL. No host port on either.
    networks:
      - cc-internal
      - shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    cpus: 0.5
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 128

  smm-auth:
    <<: *hardening
    image: ai-smm-api:${SMM_CC_VERSION:?set SMM_CC_VERSION to the full git commit the images were built from}
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    # The auth application, bound to its cc-auth address ONLY: there is no
    # listening socket on the shared network (ADR-024C-3A §9.2).
    entrypoint: ["/app/.venv/bin/uvicorn", "ai_smm.api.auth_service:create_auth_app", "--factory", "--host", "10.231.18.2", "--port", "8000", "--no-access-log", "--no-server-header"]
    # ai_smm_auth: column SELECT on users (password_hash included) and the
    # smm_auth functions; nothing else (ai_smm_auth.grants.sql).
    env_file:
      - control-center.auth.env
    environment:
      <<: *app-env
      PGAPPNAME: ai-smm-control-center-auth
      # Second layer: a peer outside cc-auth is refused by the application
      # even if the bind were ever widened.
      AI_SMM_AUTH_ALLOWED_PEERS: 10.231.18.0/29
    networks:
      cc-auth:
        ipv4_address: 10.231.18.2
      shared: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://10.231.18.2:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    cpus: 0.5
    # Argon2 costs 64 MiB per verification, two at a time.
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 64

  smm-web:
    <<: *hardening
    image: ai-smm-web:${SMM_CC_VERSION:?set SMM_CC_VERSION to the full git commit the images were built from}
    # nginx-unprivileged's own uid, spelled out so a base-image change
    # cannot silently make it root.
    user: "101:101"
    tmpfs:
      - /tmp:size=16m,mode=1777
    # The ONLY published port on the host: loopback, fixed. Reached from
    # an operator machine through an SSH tunnel; never from the internet.
    ports:
      - "127.0.0.1:8088:8080"
    # cc-edge carries the published port; cc-internal reaches the API;
    # cc-auth reaches smm-auth. Not on the shared network: the web tier
    # cannot see the database or any other project's service.
    networks:
      - cc-edge
      - cc-internal
      - cc-auth
    # Not on smm-auth: if it is down, signing in answers a JSON 502 and
    # browsing with an existing session goes on.
    depends_on:
      smm-api:
        condition: service_healthy
    # The static site AND the proxied liveness probe.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64

  # One-shot, never started by `up`, and no default command: nothing
  # migrates unless an operator types the revision.
  #   cc-compose.sh migrate current
  #   cc-compose.sh migrate upgrade 3d4ac1986f07
  migrate:
    <<: *hardening
    image: ai-smm-api:${SMM_CC_VERSION:?set SMM_CC_VERSION to the full git commit the images were built from}
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    profiles:
      - cc-migrate
    entrypoint: ["/app/.venv/bin/alembic"]
    working_dir: /app
    env_file:
      - control-center.env
    environment:
      <<: *app-env
      PGAPPNAME: ai-smm-control-center-migrate
      # Fail fast instead of queueing behind the live worker: a DDL lock
      # request that waits also blocks every later reader of that table.
      # All revisions run in ONE transaction (alembic/env.py), so a
      # timeout rolls the whole upgrade back.
      PGOPTIONS: "-c lock_timeout=5s -c statement_timeout=120s"
    networks:
      - shared
    restart: "no"
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64

  # Administrative bootstrap only. The entrypoint is pinned to the `user`
  # command group, so this service cannot schedule, approve, publish or
  # touch the queue; it creates the first owner and nothing else:
  #   cc-compose.sh create-owner --email ... --display-name ... --project ...
  cli:
    <<: *hardening
    image: ai-smm-api:${SMM_CC_VERSION:?set SMM_CC_VERSION to the full git commit the images were built from}
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    profiles:
      - cc-admin
    entrypoint: ["/app/.venv/bin/ai-smm", "user"]
    env_file:
      - control-center.env
    environment:
      <<: *app-env
      PGAPPNAME: ai-smm-control-center-cli
    networks:
      - shared
    restart: "no"
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64

networks:
  # No route out: web <-> API only.
  cc-internal:
    name: ai-smm-cc-internal
    internal: true
  # Carries the loopback port. Only smm-web is attached.
  cc-edge:
    name: ai-smm-cc-edge
  # smm-web <-> smm-auth only, no route out. A fixed /29 so that smm-auth
  # can bind its one address; it must overlap no network on the host
  # (checked before the first `up`, docs/reports/smm-025d).
  cc-auth:
    name: ai-smm-cc-auth
    internal: true
    ipam:
      config:
        - subnet: 10.231.18.0/29
  # The existing bridge the database lives on. External: this project
  # never creates, changes or removes it.
  shared:
    name: ${SMM_CC_SHARED_NETWORK:?set SMM_CC_SHARED_NETWORK to the existing network the database is reached on}
    external: true
